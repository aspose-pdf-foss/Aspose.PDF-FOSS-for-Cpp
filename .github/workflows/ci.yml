name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for a ref when a newer commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux jobs test the minimum supported compilers (README: gcc 13+,
          # clang 16+). They are pinned to an image that ships them, since
          # ubuntu-latest moves on and drops old compiler versions.
          - name: Linux / gcc
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            packages: g++-13
          - name: Linux / clang
            os: ubuntu-24.04
            cc: clang-16
            cxx: clang++-16
            packages: clang-16
          - name: Windows / MSVC
            os: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Pillow (libtiff) is an independent decoder for the CCITT TIFF test
      # (TiffCcitt.PillowReadsCcittTiffs); the test is skipped without it.
      - name: Install Pillow (Linux)
        if: runner.os == 'Linux'
        run: python3 -m pip install pillow

      - name: Install compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v "${{ matrix.cxx }}" >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.packages }}
          fi
          "${{ matrix.cxx }}" --version

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
